name: Release builds

# Installers on demand or on a version tag. Artifacts land on the workflow
# run; tag builds also attach them to a GitHub release.
#
# Repository secrets baked into the builds (Music Vault needs an account, so
# a build without them can't reach the library):
#   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY   (desktop)
#   SUPABASE_URL / SUPABASE_ANON_KEY             (Android)
#
# Every build carries the Supabase project it was built for, so the public
# repo (a source export) never builds or attaches binaries: a build there
# would either have no account or someone else's. Forks run it with their
# own secrets.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows-installer:
    if: github.repository != 'naimulnashid/music-vault'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Build NSIS installer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri build -w music-vault-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: music-vault-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  android-apk:
    if: github.repository != 'naimulnashid/music-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Debug build: signed with the debug keystore, installable for personal
      # use. Play-store signing is out of scope for v1.
      - name: Build APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: ./gradlew assembleDebug --console=plain
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: music-vault-android-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/android/app/build/outputs/apk/debug/*.apk
