<!doctype html>
<!--
  Source of docs/social-preview.png, the repository's social preview
  (GitHub: Settings > General > Social preview). 1280x640, GitHub's size.

  Everything in the mock window is ILLUSTRATIVE: covers are plain gradients,
  titles are placeholder bars and the heatmap comes from a fixed seed, so every
  render is identical and shows nobody's library. Keep it that way: no real
  song names, covers or listening data belong in an image shared publicly.

  Render with Edge (the font comes from node_modules, so `npm ci` first):

    "C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" --headless=new
      --disable-gpu --hide-scrollbars --force-device-scale-factor=1
      --window-size=1280,640 --virtual-time-budget=3000
      --user-data-dir=%TEMP%\social-preview-edge
      --screenshot=%CD%\docs\social-preview.png %CD%\docs\social-preview.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Vault</title>
<style>
  @font-face {
    font-family: Figtree;
    font-weight: 300 900;
    src: url(../node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2) format('woff2');
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: Figtree, system-ui, sans-serif;
    color: #f4f4f7;
    background:
      radial-gradient(700px 500px at 8% 0%, rgb(139 92 246 / 0.35), transparent 70%),
      radial-gradient(600px 500px at 100% 100%, rgb(192 38 211 / 0.22), transparent 70%),
      #0c0c10;
    display: flex;
    align-items: center;
    padding: 0 64px;
    gap: 56px;
  }
  .copy { width: 470px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 20px; }
  .brand svg { width: 84px; height: 84px; filter: drop-shadow(0 14px 30px rgb(124 58 237 / 0.5)); }
  h1 { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .tagline { margin-top: 30px; font-size: 27px; line-height: 1.35; color: #c9c9d3; font-weight: 500; }
  .chips { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    padding: 9px 16px; border-radius: 999px; font-size: 17px; font-weight: 600;
    background: rgb(255 255 255 / 0.07); border: 1px solid rgb(255 255 255 / 0.1); color: #e4e4ea;
  }
  .chip b { color: #b79cfb; font-weight: 700; }

  .window {
    flex: 1; height: 500px; border-radius: 22px; overflow: hidden;
    background: #141419; border: 1px solid rgb(255 255 255 / 0.09);
    box-shadow: 0 40px 90px -30px rgb(0 0 0 / 0.8);
    display: grid; grid-template-columns: 64px 1fr; grid-template-rows: 1fr 78px;
  }
  .rail { grid-row: 1 / 3; background: #101015; padding: 22px 0; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .rail i { width: 26px; height: 26px; border-radius: 7px; background: rgb(255 255 255 / 0.12); display: block; }
  .rail i.on { background: #8b5cf6; }
  .rail i.pl { width: 34px; height: 34px; border-radius: 9px; }
  .main { padding: 24px 26px 0; overflow: hidden; }
  .bar { height: 12px; border-radius: 6px; background: rgb(255 255 255 / 0.14); }
  .title { width: 170px; height: 20px; border-radius: 8px; background: rgb(255 255 255 / 0.85); }
  .grid { margin-top: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .card .cover { aspect-ratio: 1; border-radius: 12px; }
  .card .bar { margin-top: 10px; width: 80%; }
  .card .bar.s { margin-top: 7px; width: 55%; height: 9px; background: rgb(255 255 255 / 0.08); }
  .heat { margin-top: 20px; display: grid; grid-template-columns: repeat(26, 1fr); grid-template-rows: repeat(4, 10px); gap: 3px; }
  .heat span { border-radius: 2px; }
  .player {
    border-top: 1px solid rgb(255 255 255 / 0.08); background: rgb(28 28 34 / 0.95);
    display: flex; align-items: center; gap: 16px; padding: 0 22px; position: relative;
  }
  .player .seek { position: absolute; left: 0; right: 0; top: -2px; height: 3px; background: rgb(255 255 255 / 0.1); }
  .player .seek::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 38%; background: #8b5cf6; }
  .player .art { width: 48px; height: 48px; border-radius: 9px; }
  .player .play { width: 46px; height: 46px; border-radius: 50%; background: #f4f4f7; margin-left: auto; margin-right: 8px; display: grid; place-items: center; }
  .player .play::after { content: ''; width: 14px; height: 16px; background: #141419; clip-path: polygon(15% 0, 15% 100%, 100% 50%); margin-left: 3px; }
  .player .icons { display: flex; gap: 14px; margin-left: auto; }
  .player .icons i { width: 20px; height: 20px; border-radius: 5px; background: rgb(255 255 255 / 0.18); display: block; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
        <rect width="32" height="32" rx="8" fill="url(#g)"/>
        <path d="M13 21.5V10.2l9-1.9v11.1" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <ellipse cx="10.9" cy="21.6" rx="2.6" ry="2.1" fill="#fff"/>
        <ellipse cx="19.9" cy="19.6" rx="2.6" ry="2.1" fill="#fff"/>
      </svg>
      <h1>Music Vault</h1>
    </div>
    <p class="tagline">Your own music library and player, on Windows, Android and the web.</p>
    <div class="chips">
      <span class="chip"><b>Self-hosted</b> on Supabase + R2</span>
      <span class="chip">Synced playlists</span>
      <span class="chip">Offline downloads</span>
      <span class="chip">Listening stats</span>
    </div>
  </div>

  <div class="window">
    <div class="rail">
      <i class="on"></i><i></i><i></i><i></i>
      <i class="pl" style="background:linear-gradient(135deg,#a78bfa,#c026d3)"></i>
      <i class="pl" style="background:linear-gradient(135deg,#38bdf8,#4f46e5)"></i>
      <i class="pl" style="background:linear-gradient(135deg,#f97316,#e11d48)"></i>
    </div>
    <div class="main">
      <div class="title"></div>
      <div class="grid" id="grid"></div>
      <div class="heat" id="heat"></div>
    </div>
    <div class="player">
      <div class="seek"></div>
      <div class="art" style="background:linear-gradient(135deg,#a78bfa,#6d28d9)"></div>
      <div>
        <div class="bar" style="width:150px;background:rgb(255 255 255 / 0.8)"></div>
        <div class="bar" style="width:100px;margin-top:8px;height:9px"></div>
      </div>
      <div class="play"></div>
      <div class="icons"><i></i><i></i><i></i><i></i></div>
    </div>
  </div>

<script>
  // Fixed-seed covers and heatmap: identical on every render, nobody's data.
  let seed = 7;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pairs = [
    ['#a78bfa', '#6d28d9'], ['#f97316', '#e11d48'], ['#22d3ee', '#2563eb'], ['#34d399', '#0f766e'],
    ['#f472b6', '#9333ea'], ['#fbbf24', '#ea580c'], ['#60a5fa', '#7c3aed'], ['#fb7185', '#be123c'],
    ['#c084fc', '#4f46e5'], ['#2dd4bf', '#0369a1'],
  ];
  const grid = document.getElementById('grid');
  pairs.forEach(([a, b], i) => {
    const angle = 120 + Math.round(rand() * 90);
    grid.insertAdjacentHTML('beforeend',
      `<div class="card"><div class="cover" style="background:linear-gradient(${angle}deg,${a},${b})"></div>` +
      `<div class="bar"></div><div class="bar s"></div></div>`);
  });
  const heat = document.getElementById('heat');
  for (let c = 0; c < 26 * 4; c++) {
    const r = rand();
    const mix = r < 0.45 ? 0 : r < 0.7 ? 30 : r < 0.85 ? 55 : r < 0.95 ? 80 : 100;
    heat.insertAdjacentHTML('beforeend',
      `<span style="background:${mix ? `color-mix(in srgb, #8b5cf6 ${mix}%, #24242c)` : '#24242c'}"></span>`);
  }
</script>
</body>
</html>
